[project]
name = "motif-forge"
version = "0.1.0"
description = "A local-first agentic instrumental composition workbench."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2.0",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "langchain-core>=1.2,<2.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-postgres>=3.0,<4.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2.0",
  "pytest>=8.4,<10.0",
  "pytest-asyncio>=1.1,<2.0",
  "pytest-cov>=6.2,<8.0",
  "ruff>=0.12,<1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/api/src/motif_forge"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["services/api/src"]
testpaths = ["services/api/tests", "tests"]

[tool.ruff]
extend-exclude = ["._*", "**/._*"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
exclude = "(^|/)\\._"
python_version = "3.12"
strict = true
packages = ["motif_forge"]
mypy_path = "services/api/src"
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["motif_forge"]

[tool.coverage.report]
show_missing = true
skip_covered = true
