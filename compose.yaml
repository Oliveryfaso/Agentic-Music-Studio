services:
  api:
    image: motif-forge-api:local
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: api
    env_file:
      - .env
    environment:
      DEEPSEEK_API_KEY: ""
      MOTIF_FORGE_STORAGE_PROFILE: lean
      MOTIF_FORGE_ARTIFACT_ROOT: /artifacts
      MOTIF_FORGE_TEMP_ROOT: /temp
    volumes:
      - ${MOTIF_FORGE_ARTIFACT_HOST_ROOT:-./var/artifacts}:/artifacts
      - ${MOTIF_FORGE_TEMP_ROOT:-./var/tmp}:/temp
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    image: motif-forge-api:local
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: api
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      DEEPSEEK_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  storage-init:
    image: motif-forge-api:local
    environment:
      DEEPSEEK_API_KEY: ""
    command:
      [
        "sh",
        "-c",
        "mkdir -p /temp/jobs /artifacts/quarantine/source-original /artifacts/protected/working-pcm /artifacts/derived/time-stretch /artifacts/rebuildable/features && chmod 1777 /temp /temp/jobs /artifacts/quarantine /artifacts/quarantine/source-original /artifacts/protected /artifacts/protected/working-pcm /artifacts/derived /artifacts/derived/time-stretch /artifacts/rebuildable /artifacts/rebuildable/features",
      ]
    volumes:
      - ${MOTIF_FORGE_ARTIFACT_HOST_ROOT:-./var/artifacts}:/artifacts
      - ${MOTIF_FORGE_TEMP_ROOT:-./var/tmp}:/temp
    restart: "no"

  dispatcher:
    image: motif-forge-api:local
    command: ["python", "-m", "motif_forge.worker.dispatcher"]
    env_file:
      - .env
    environment:
      DEEPSEEK_API_KEY: ""
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  resume-dispatcher:
    image: motif-forge-api:local
    command: ["python", "-m", "motif_forge.worker.resume_dispatcher"]
    env_file:
      - .env
    environment:
      DEEPSEEK_API_KEY: ""
      MOTIF_FORGE_STORAGE_PROFILE: lean
      MOTIF_FORGE_ARTIFACT_ROOT: /artifacts
      MOTIF_FORGE_TEMP_ROOT: /temp
    volumes:
      - ${MOTIF_FORGE_ARTIFACT_HOST_ROOT:-./var/artifacts}:/artifacts
      - ${MOTIF_FORGE_TEMP_ROOT:-./var/tmp}:/temp
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  media-worker:
    image: motif-forge-media-worker:local
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: media-worker
    command:
      [
        "celery",
        "-A",
        "motif_forge.worker.celery_app:celery_app",
        "worker",
        "--queues=media",
        "--concurrency=1",
        "--prefetch-multiplier=1",
        "--without-gossip",
        "--without-mingle",
        "--loglevel=INFO",
      ]
    env_file:
      - .env
    environment:
      DEEPSEEK_API_KEY: ""
      MOTIF_FORGE_STORAGE_PROFILE: lean
      MOTIF_FORGE_ARTIFACT_ROOT: /artifacts
      MOTIF_FORGE_TEMP_ROOT: /temp
      MOTIF_FORGE_RENDER_SERVICE_URL: http://render-worker:8090
    volumes:
      - ${MOTIF_FORGE_ARTIFACT_HOST_ROOT:-./var/artifacts}:/artifacts
      - ${MOTIF_FORGE_TEMP_ROOT:-./var/tmp}:/temp
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  render-worker:
    image: motif-forge-render-worker:local
    build:
      context: .
      dockerfile: services/render-worker/Dockerfile
    environment:
      DEEPSEEK_API_KEY: ""
      MOTIF_FORGE_ARTIFACT_ROOT: /artifacts
      MOTIF_FORGE_TEMP_ROOT: /temp
      MOTIF_FORGE_RENDER_PORT: 8090
    volumes:
      - ${MOTIF_FORGE_ARTIFACT_HOST_ROOT:-./var/artifacts}:/artifacts
      - ${MOTIF_FORGE_TEMP_ROOT:-./var/tmp}:/temp
    depends_on:
      storage-init:
        condition: service_completed_successfully
    expose:
      - "8090"
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
    stop_grace_period: 30s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: motif_forge
      POSTGRES_USER: motif_forge
      POSTGRES_PASSWORD: motif_forge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motif_forge -d motif_forge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - motif_forge_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  motif_forge_postgres:
